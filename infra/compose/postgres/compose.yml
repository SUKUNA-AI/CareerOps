name: careerops-postgres

services:
  postgres:
    image: postgres:18.6
    container_name: careerops-postgres
    env_file:
      - /etc/careerops/postgres/env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /srv/careerops/postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    build:
      context: ../../..
      dockerfile: infra/compose/postgres/migrate.Dockerfile
    container_name: careerops-postgres-migrate
    network_mode: host
    env_file:
      - /etc/careerops/postgres/env
    restart: "no"
    profiles:
      - admin
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
