name: careerops

services:
  postgres:
    profiles: ["state"]
    image: postgres:18.6
    container_name: careerops-postgres
    env_file:
      - /etc/careerops/postgres/env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /srv/careerops/postgres:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    profiles: ["admin"]
    build:
      context: ../../..
      dockerfile: infra/compose/postgres/migrate.Dockerfile
    container_name: careerops-postgres-migrate
    network_mode: host
    env_file:
      - /etc/careerops/postgres/env
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777

  seaweed-master:
    profiles: ["state"]
    image: chrislusf/seaweedfs:4.41
    container_name: careerops-seaweed-master
    command: ["master", "-ip=seaweed-master", "-ip.bind=0.0.0.0", "-port=9333", "-mdir=/data", "-peers=none", "-defaultReplication=000"]
    volumes:
      - /srv/careerops/seaweedfs/master:/data
    networks: ["seaweed"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweed-volume:
    profiles: ["state"]
    image: chrislusf/seaweedfs:4.41
    container_name: careerops-seaweed-volume
    command: ["volume", "-ip=seaweed-volume", "-ip.bind=0.0.0.0", "-port=8080", "-dir=/data", "-master=seaweed-master:9333", "-dataCenter=home", "-rack=single-host", "-max=10", "-minFreeSpace=10GiB"]
    volumes:
      - /srv/careerops/seaweedfs/volume:/data
    networks: ["seaweed"]
    restart: unless-stopped
    depends_on:
      seaweed-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweed-filer:
    profiles: ["state"]
    image: chrislusf/seaweedfs:4.41
    container_name: careerops-seaweed-filer
    command: ["filer", "-ip=seaweed-filer", "-ip.bind=0.0.0.0", "-port=8888", "-master=seaweed-master:9333", "-defaultStoreDir=/data"]
    volumes:
      - /srv/careerops/seaweedfs/filer:/data
    networks: ["seaweed"]
    restart: unless-stopped
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8888/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  seaweed-s3:
    profiles: ["state"]
    image: chrislusf/seaweedfs:4.41
    container_name: careerops-seaweed-s3
    command: ["s3", "-ip=seaweed-s3", "-ip.bind=0.0.0.0", "-port=8333", "-filer=seaweed-filer:8888", "-config=/etc/seaweedfs/s3.json", "-allowDeleteBucketNotEmpty=false"]
    volumes:
      - /etc/careerops/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:8333:8333"
    networks: ["seaweed"]
    restart: unless-stopped
    depends_on:
      seaweed-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -q '403 Forbidden'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  hh-adapter:
    profiles: ["collect"]
    build:
      context: ../../..
      dockerfile: infra/compose/hh-adapter/Dockerfile
    container_name: careerops-hh-adapter
    network_mode: host
    env_file:
      - /etc/careerops/hh-adapter/env
    volumes:
      - /etc/careerops/hh:/etc/careerops/hh:ro
      - /etc/careerops/hh-applicant-tool:/var/lib/careerops/hh-applicant-tool:rw
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777

  normalizer:
    profiles: ["normalize"]
    build:
      context: ../../..
      dockerfile: infra/compose/normalizer/Dockerfile
    container_name: careerops-normalizer
    network_mode: host
    env_file:
      - /etc/careerops/normalizer/env
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=512m,mode=1777

  matching-core:
    profiles: ["decision"]
    build:
      context: ../../..
      dockerfile: infra/compose/matching-core/Dockerfile
    container_name: careerops-matching-core
    network_mode: host
    environment:
      CAREEROPS_MATCHING_CORE_LISTEN_ADDR: 127.0.0.1:50051
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "careerops-matching-core", "--healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  reranker:
    profiles: ["decision"]
    image: careerops-reranker:2.14-cu132-fp16
    build:
      context: ../../..
      dockerfile: infra/compose/reranker/Dockerfile
    container_name: careerops-reranker
    network_mode: host
    env_file:
      - /etc/careerops/reranker/env
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      XDG_CACHE_HOME: /cache
      TRITON_CACHE_DIR: /cache/triton
      HOME: /tmp
    volumes:
      - /var/lib/careerops/reranker-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.getenv('CAREEROPS_RERANKER_PORT', '18082');
          urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=3).read()
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  processing:
    profiles: ["decision"]
    build:
      context: ../../..
      dockerfile: infra/compose/processing/Dockerfile
    container_name: careerops-processing
    network_mode: host
    env_file:
      - /etc/careerops/processing/env
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.getenv('CAREEROPS_PROCESSING_HEALTH_PORT', '18081');
          urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=2).read()
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

  application-owner:
    profiles: ["apply"]
    build:
      context: ../../..
      dockerfile: infra/compose/application-owner/Dockerfile
    container_name: careerops-application-owner
    network_mode: host
    env_file:
      - /etc/careerops/application-owner/env
    volumes:
      - /etc/careerops/hh-applicant-tool:/var/lib/careerops/hh-applicant-tool:rw
    restart: unless-stopped
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os, urllib.request;
          port = os.getenv('CAREEROPS_APPLICATION_HEALTH_PORT', '18083');
          urllib.request.urlopen(f'http://127.0.0.1:{port}/readyz', timeout=2).read()
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  seaweed:
    driver: bridge
