services:
  careerops-hh-worker:
    container_name: careerops-hh-worker
    build:
      context: ../../..
      dockerfile: infra/compose/hh-worker/Dockerfile
    network_mode: host
    working_dir: /app
    env_file:
      - /etc/careerops/hh/env
      - /etc/careerops/hh/scheduler.env
    volumes:
      - ../../../hh-applicant-tool/config:/app/hh-applicant-tool/config:rw
      - /etc/careerops/hh/accounts.toml:/etc/careerops/hh/accounts.toml:ro
      - ../../../config:/srv/careerops/app/config:ro
    restart: "no"
