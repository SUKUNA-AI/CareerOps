[project]
name = "careerops"
version = "0.1.0"
description = "CareerOPS self-hosted job market data platform"
requires-python = ">=3.12,<3.14"

dependencies = [
    "pydantic>=2.11,<3",
    "aioboto3>=15.5,<16",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
    "alembic>=1.19,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "integration_postgres: uses real PostgreSQL DDL/DML, constraints, transactions, locking or concurrency; requires an explicitly configured disposable local test target via CAREEROPS_TEST_POSTGRES_DSN; no runtime/production DSN fallback",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["hh_applicant_tool", "hh_applicant_tool.*"]
ignore_missing_imports = true
