name: Working calibration fixes

on:
  push:
    branches:
      - ar/pre-p208-cleanup-calibration

permissions:
  contents: write

jobs:
  apply-p204-benefits-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ar/pre-p208-cleanup-calibration
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Apply safe P2-04 benefits-section prune
        shell: python
        run: |
          from pathlib import Path

          req = Path('src/careerops_processing/core/requirements.py')
          text = req.read_text(encoding='utf-8')

          marker = '_GENERIC_EXPERIENCE_SUBJECTS = {"опыт", "experience", "стаж"}\n'
          addition = '''_NON_REQUIREMENT_BENEFIT_SECTIONS = (\n    "мы предлагаем",\n    "что мы предлагаем",\n    "что предлагаем",\n    "мы можем предложить",\n    "что ты приобрет",\n    "что ты получ",\n    "социальный пакет",\n    "соцпакет",\n    "бонус",\n    "льгот",\n    "дмс",\n    "плюшк",\n    "we offer",\n    "what we offer",\n    "benefits",\n    "perks",\n)\n'''
          if '_NON_REQUIREMENT_BENEFIT_SECTIONS' not in text:
              if marker not in text:
                  raise SystemExit('requirements constants marker not found')
              text = text.replace(marker, marker + addition)

          helper_anchor = '''def _section_text(block: TextBlock) -> str:\n    return " ".join(part for part in (block.heading, block.section_hint) if part).casefold()\n\n\n'''
          helper = '''def _is_non_requirement_benefit_section(block: TextBlock) -> bool:\n    section = _section_text(block)\n    return any(marker in section for marker in _NON_REQUIREMENT_BENEFIT_SECTIONS)\n\n\n'''
          if '_is_non_requirement_benefit_section' not in text:
              if helper_anchor not in text:
                  raise SystemExit('section helper anchor not found')
              text = text.replace(helper_anchor, helper_anchor + helper)

          loop_anchor = '''    for block in sorted(vacancy.text_blocks, key=lambda item: item.ordinal):\n        section = _section_text(block)\n'''
          loop_new = '''    for block in sorted(vacancy.text_blocks, key=lambda item: item.ordinal):\n        if _is_non_requirement_benefit_section(block):\n            continue\n        section = _section_text(block)\n'''
          if loop_new not in text:
              if loop_anchor not in text:
                  raise SystemExit('text block loop anchor not found')
              text = text.replace(loop_anchor, loop_new)

          req.write_text(text, encoding='utf-8')

          hardening = Path('tests/test_processing_p204_hardening.py')
          t = hardening.read_text(encoding='utf-8')
          test_marker = 'def test_technology_with_experience_threshold_stays_technology() -> None:\n'
          test_case = '''def test_offer_benefit_sections_are_ignored_without_dropping_requirements() -> None:\n    def block(\n        block_id: str,\n        text: str,\n        ordinal: int,\n        heading: str,\n        section_hint: str,\n    ) -> TextBlock:\n        return TextBlock(\n            block_id=block_id,\n            text=text,\n            ordinal=ordinal,\n            heading=heading,\n            section_hint=section_hint,\n            source_ref=SourceTextRef(\n                source_path="description",\n                locator=f"block:{block_id}",\n                quote=text,\n            ),\n        )\n\n    vacancy = _vacancy().model_copy(\n        update={\n            "text_blocks": (\n                block("requirements", "Python", 0, "Требования", "requirements"),\n                block("benefits", "ДМС, бонусы, обучение", 1, "Мы предлагаем", "benefits"),\n                block("preferred", "Airflow", 2, "Будет плюсом", "preferred"),\n                block("conditions", "Удаленная работа", 3, "Условия", "conditions"),\n            )\n        }\n    )\n\n    result = extract_requirements(vacancy, extraction_version="requirements-v2")\n    statements = {item.statement.casefold() for item in result.requirements}\n\n    assert "python" in statements\n    assert "airflow" in statements\n    assert "удаленная работа" in statements\n    assert not any("дмс" in item or "бонус" in item for item in statements)\n\n\n'''
          if 'test_offer_benefit_sections_are_ignored_without_dropping_requirements' not in t:
              if test_marker not in t:
                  raise SystemExit('P2-04 hardening test marker not found')
              t = t.replace(test_marker, test_case + test_marker)
          hardening.write_text(t, encoding='utf-8')

          p204 = Path('tests/test_processing_p204.py')
          t = p204.read_text(encoding='utf-8')
          old = '''    if frontend_exclusion:\n        filtering["allowed_primary_roles"] = ["data_engineering"]\n'''
          new = '''    if frontend_exclusion:\n        filtering["forbidden_primary_roles"] = ["frontend"]\n'''
          if old in t:
              t = t.replace(old, new)
          elif new not in t:
              raise SystemExit('P2-04 exclusion fixture marker not found')
          p204.write_text(t, encoding='utf-8')

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Targeted checks
        run: |
          ruff check \
            src/careerops_processing/core/requirements.py \
            tests/test_processing_p204.py \
            tests/test_processing_p204_hardening.py
          pytest -q \
            tests/test_processing_p204.py \
            tests/test_processing_p204_hardening.py

      - name: Commit verified fix
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/careerops_processing/core/requirements.py \
            tests/test_processing_p204.py \
            tests/test_processing_p204_hardening.py
          git commit -m 'fix: убрать benefit-секции из P2-04 requirements'
          git push origin HEAD:ar/pre-p208-cleanup-calibration
