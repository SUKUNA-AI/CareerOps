name: Storage integration

on:
  push:
    branches:
      - main
      - architecture-reset
      - "ar/**"
  pull_request:
    branches:
      - main
      - architecture-reset
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seaweedfs-s3:
    name: SeaweedFS 4.41 / S3 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CAREEROPS_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      CAREEROPS_TEST_S3_ACCESS_KEY: careerops-ci
      CAREEROPS_TEST_S3_SECRET_KEY: careerops-ci-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Start disposable SeaweedFS S3
        run: |
          set -euo pipefail
          docker run -d \
            --name careerops-seaweedfs-ci \
            -p 127.0.0.1:8333:8333 \
            chrislusf/seaweedfs:4.41 \
            server -s3 -dir=/data

          ready=0
          for attempt in $(seq 1 30); do
            if curl -sS -o /dev/null http://127.0.0.1:8333/; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            docker logs careerops-seaweedfs-ci || true
            exit 1
          fi

      - name: Run SeaweedFS integration suite
        run: |
          mkdir -p reports
          python -m pytest \
            -q \
            --tb=short \
            -p no:cacheprovider \
            -m "integration_storage" \
            tests/integration/storage \
            --junitxml=reports/storage-integration.xml

      - name: Collect SeaweedFS diagnostics
        if: ${{ failure() }}
        run: |
          mkdir -p reports
          docker logs careerops-seaweedfs-ci > reports/seaweedfs.log 2>&1 || true
          docker inspect careerops-seaweedfs-ci > reports/seaweedfs-inspect.json 2>&1 || true

      - name: Upload storage diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: storage-integration
          path: reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Stop SeaweedFS
        if: ${{ always() }}
        run: docker rm -f careerops-seaweedfs-ci || true
