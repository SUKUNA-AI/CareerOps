name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src scripts tests

      - name: mypy
        run: python -m mypy src

      - name: Check dependency consistency
        run: python -m pip check

  fast-tests:
    name: Fast tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Run fast pytest suite
        run: >
          python -m pytest
          -q
          -p no:cacheprovider
          -m "not integration_postgres"