name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src scripts tests

      - name: mypy
        run: python -m mypy src

      - name: Check dependency consistency
        run: python -m pip check

  fast-tests:
    name: Fast tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Run fast pytest suite
        run: |
          mkdir -p reports
          python -m pytest \
            -q \
            --tb=short \
            -p no:cacheprovider \
            -m "not integration_postgres" \
            --junitxml=reports/pytest.xml

      - name: Collect failure diagnostics
        if: ${{ failure() && !cancelled() }}
        run: |
          mkdir -p reports

          {
            echo "Python:"
            python --version || true

            echo
            echo "pip:"
            python -m pip --version || true

            echo
            echo "Dependency consistency:"
            python -m pip check || true

            echo
            echo "Installed packages:"
            python -m pip list --format=freeze || true
          } | tee reports/environment.txt

      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fast-tests-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7