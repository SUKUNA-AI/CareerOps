name: CI

on:
  push:
    branches:
      - main
      - architecture-reset
      - "ar/**"
  pull_request:
    branches:
      - main
      - architecture-reset
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff / mypy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check src tests alembic
      - name: mypy
        run: python -m mypy src

  python-tests:
    name: Python tests / ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            hh-applicant-tool/pyproject.toml
      - name: Install CareerOPS and applicant vendor
        run: python -m pip install -e ".[dev]" ./hh-applicant-tool
      - name: Run Python suite
        run: >-
          python -m pytest -q --tb=short -p no:cacheprovider
          -m "not integration_postgres and not integration_storage and
          not integration_matching_core and not integration_e2e_baseline"

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: careerops_ci
          POSTGRES_PASSWORD: careerops_ci
          POSTGRES_DB: careerops_v2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerops_ci -d careerops_v2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CAREEROPS_TEST_POSTGRES_DSN: >-
        postgresql://careerops_ci:careerops_ci@127.0.0.1:5432/careerops_v2_ci

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            hh-applicant-tool/pyproject.toml
      - name: Install CareerOPS and applicant vendor
        run: python -m pip install -e ".[dev]" ./hh-applicant-tool
      - name: Run PostgreSQL integration suite
        run: >-
          python -m pytest -q --tb=short -p no:cacheprovider
          -m integration_postgres

  seaweedfs-integration:
    name: SeaweedFS integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CAREEROPS_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      CAREEROPS_TEST_S3_ACCESS_KEY: careerops-ci
      CAREEROPS_TEST_S3_SECRET_KEY: careerops-ci-secret

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"
      - name: Start disposable SeaweedFS S3
        run: |
          set -euo pipefail
          docker run -d \
            --name careerops-seaweedfs-ci \
            -p 127.0.0.1:8333:8333 \
            chrislusf/seaweedfs:4.41 \
            server -s3 -dir=/data
          for attempt in $(seq 1 30); do
            if curl -sS -o /dev/null http://127.0.0.1:8333/; then
              exit 0
            fi
            sleep 1
          done
          docker logs careerops-seaweedfs-ci || true
          exit 1
      - name: Run SeaweedFS integration suite
        run: >-
          python -m pytest -q --tb=short -p no:cacheprovider
          -m integration_storage tests/integration/storage
      - name: Stop SeaweedFS
        if: ${{ always() }}
        run: docker rm -f careerops-seaweedfs-ci || true

  matching-core-build:
    name: C++ build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Install C++ and gRPC build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libboost-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc
      - name: Configure matching core
        run: >-
          cmake -S services/careerops-matching-core -B build/matching-core
          -DCMAKE_BUILD_TYPE=Release
      - name: Build matching core
        run: cmake --build build/matching-core --parallel
      - name: Verify executable
        run: |
          set -euo pipefail
          test -x build/matching-core/careerops-matching-core
          ldd build/matching-core/careerops-matching-core | tee matching-core-ldd.txt
          ! grep -q "not found" matching-core-ldd.txt
      - uses: actions/upload-artifact@v7
        with:
          name: matching-core-binary
          path: build/matching-core/careerops-matching-core
          if-no-files-found: error
          retention-days: 3

  grpc-contract:
    name: gRPC contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: matching-core-build

    steps:
      - uses: actions/checkout@v7
      - name: Install matching-core runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgrpc++-dev libprotobuf-dev
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install gRPC contract dependencies
        run: python -m pip install -e ".[dev,matching-core-test]"
      - uses: actions/download-artifact@v7
        with:
          name: matching-core-binary
          path: build/matching-core-artifact
      - name: Run Python to C++ gRPC contract
        env:
          CAREEROPS_MATCHING_CORE_BINARY: >-
            ${{ github.workspace }}/build/matching-core-artifact/careerops-matching-core
        run: |
          chmod +x "${CAREEROPS_MATCHING_CORE_BINARY}"
          python -m pytest \
            -q --tb=short -p no:cacheprovider \
            -m integration_matching_core \
            tests/integration/matching_core

  normalizer-contract:
    name: Normalizer contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install contract test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Validate normalized contracts and Parquet publication identity
        run: >-
          python -m pytest -q --tb=short -p no:cacheprovider
          tests/test_normalizer_spark_contract.py
      - name: Build parked Spark normalizer image
        run: >-
          docker build
          -f infra/compose/normalizer/Dockerfile
          -t careerops-normalizer:freeze
          .
      - name: Smoke Spark Parquet writer
        run: |
          docker run --rm \
            -v "${PWD}/tests/fixtures/spark_parquet_smoke.py:/tmp/careerops-parquet-smoke.py:ro" \
            --entrypoint /opt/spark/bin/spark-submit \
            careerops-normalizer:freeze \
            --master local[1] \
            /tmp/careerops-parquet-smoke.py
