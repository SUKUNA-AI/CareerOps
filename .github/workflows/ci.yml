name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src scripts tests

      - name: mypy
        run: python -m mypy src

      - name: Check dependency consistency
        run: python -m pip check

  fast-tests:
    name: Fast tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Run fast pytest suite
        run: |
          mkdir -p reports
          python -m pytest \
            -q \
            --tb=short \
            -p no:cacheprovider \
            -m "not integration_postgres" \
            --junitxml=reports/pytest.xml

      - name: Collect failure diagnostics
        if: ${{ failure() && !cancelled() }}
        run: |
          mkdir -p reports

          {
            echo "Python:"
            python --version || true

            echo
            echo "pip:"
            python -m pip --version || true

            echo
            echo "Dependency consistency:"
            python -m pip check || true

            echo
            echo "Installed packages:"
            python -m pip list --format=freeze || true
          } | tee reports/environment.txt

      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fast-tests-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    env:
      CAREEROPS_TEST_POSTGRES_DSN: postgresql://careerops_ci:careerops_ci@127.0.0.1:5432/careerops_ci_test

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: careerops_ci
          POSTGRES_PASSWORD: careerops_ci
          POSTGRES_DB: careerops_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerops_ci -d careerops_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Verify PostgreSQL 18.6 service
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["CAREEROPS_TEST_POSTGRES_DSN"]) as connection:
              version_num = connection.execute("SHOW server_version_num").fetchone()[0]

          if version_num != "180006":
              raise SystemExit(f"expected PostgreSQL 18.6 (180006), got {version_num}")
          print("PostgreSQL server_version_num:", version_num)
          PY

      - name: Run PostgreSQL integration suite
        run: |
          mkdir -p reports
          python -m pytest \
            -q \
            --tb=short \
            -p no:cacheprovider \
            -m "integration_postgres" \
            --junitxml=reports/postgres-integration.xml

      - name: Collect PostgreSQL failure diagnostics
        if: ${{ failure() && !cancelled() }}
        run: |
          mkdir -p reports

          python - <<'PY' | tee reports/postgres-environment.txt
          import os
          import platform

          import psycopg

          print("Python:", platform.python_version())
          try:
              with psycopg.connect(os.environ["CAREEROPS_TEST_POSTGRES_DSN"]) as connection:
                  print("server_version:", connection.execute("SHOW server_version").fetchone()[0])
                  print("database:", connection.execute("SELECT current_database()").fetchone()[0])
                  print("user:", connection.execute("SELECT current_user").fetchone()[0])
          except Exception as exc:
              print("PostgreSQL diagnostic connection failed:", type(exc).__name__, str(exc))
          PY

      - name: Upload PostgreSQL test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration
          path: reports/
          if-no-files-found: warn
          retention-days: 7
