name: CI

on:
  pull_request:
    branches:
      - main
      - architecture-reset
      - ar/processing-v2

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check src tests

      - name: mypy
        run: python -m mypy src

      - name: Check dependency consistency
        run: python -m pip check

  fast-tests:
    name: Fast tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Run fast pytest suite
        run: |
          mkdir -p reports
          python -m pytest \
            -q \
            --tb=short \
            -p no:cacheprovider \
            -m "not integration_postgres" \
            --junitxml=reports/pytest.xml

      - name: Collect failure diagnostics
        if: ${{ failure() && !cancelled() }}
        run: |
          mkdir -p reports

          {
            echo "Python:"
            python --version || true

            echo
            echo "pip:"
            python -m pip --version || true

            echo
            echo "Dependency consistency:"
            python -m pip check || true

            echo
            echo "Installed packages:"
            python -m pip list --format=freeze || true
          } | tee reports/environment.txt

      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: fast-tests-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: careerops_ci
          POSTGRES_PASSWORD: careerops_ci
          POSTGRES_DB: careerops_v2_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careerops_ci -d careerops_v2_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CAREEROPS_TEST_POSTGRES_DSN: >-
        postgresql://careerops_ci:careerops_ci@127.0.0.1:5432/careerops_v2_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CareerOPS
        run: python -m pip install -e ".[dev]"

      - name: Run PostgreSQL integration suite
        run: |
          mkdir -p reports
          python -m pytest \
            -q \
            --tb=short \
            -p no:cacheprovider \
            -m "integration_postgres" \
            --junitxml=reports/postgres-integration.xml

      - name: Collect PostgreSQL failure diagnostics
        if: ${{ failure() && !cancelled() }}
        run: |
          mkdir -p reports
          {
            echo "Python:"
            python --version || true
            echo
            echo "Docker:"
            docker version || true
            echo
            echo "Containers:"
            docker ps -a || true
          } | tee reports/postgres-environment.txt

      - name: Upload PostgreSQL test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: postgres-integration
          path: reports/
          if-no-files-found: warn
          retention-days: 7
