name: Calibration Runtime Export

on:
  push:
    branches:
      - ar/pre-p208-cleanup-calibration
    paths:
      - .github/workflows/calibration-runtime-export.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-runtime:
    name: Export offline Jina runtime chunks
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      CAREEROPS_RERANKER_RUNTIME_BACKEND: transformers-cpu
      CAREEROPS_RERANKER_DTYPE: float32
      CAREEROPS_RERANKER_DEVICE: cpu
      CAREEROPS_RERANKER_HOST: 127.0.0.1
      CAREEROPS_RERANKER_PORT: "18082"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pinned Jina model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: jina-reranker-v3.5-e8a93f33-python312-${{ runner.os }}

      - name: Install exact CPU runtime
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.14.0"
          python -m pip install "transformers==4.57.3"
          python -m pip check

      - name: Materialize pinned model cache
        run: |
          set -euo pipefail
          mkdir -p runtime-export
          nohup python -m careerops_reranker > runtime-export/reranker.log 2>&1 &
          echo $! > runtime-export/reranker.pid
          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18082/readyz \
              -o runtime-export/reranker-ready.json; then
              kill "$(cat runtime-export/reranker.pid)" 2>/dev/null || true
              exit 0
            fi
            if ! kill -0 "$(cat runtime-export/reranker.pid)" 2>/dev/null; then
              cat runtime-export/reranker.log >&2 || true
              exit 1
            fi
            sleep 5
          done
          cat runtime-export/reranker.log >&2 || true
          exit 1

      - name: Pack small runtime dependencies and source
        run: |
          set -euo pipefail
          mkdir -p runtime-export/wheels runtime-export/chunks
          python -m pip download --dest runtime-export/wheels \
            "transformers==4.57.3" \
            "tokenizers==0.22.2" \
            "huggingface-hub==0.36.2"
          tar -czf runtime-export/careerops-source.tar.gz \
            src config pyproject.toml
          tar -cf runtime-export/huggingface-cache.tar -C .cache huggingface
          split -b 350M -d -a 2 \
            runtime-export/huggingface-cache.tar \
            runtime-export/chunks/hf-cache.part-
          ls -lh runtime-export/chunks

      - name: Upload runtime core
        uses: actions/upload-artifact@v7
        with:
          name: careerops-calibration-runtime-core
          path: |
            runtime-export/careerops-source.tar.gz
            runtime-export/wheels/
            runtime-export/reranker-ready.json
          if-no-files-found: error
          retention-days: 2
          compression-level: 1

      - name: Upload HF cache part 00
        uses: actions/upload-artifact@v7
        with:
          name: careerops-jina-cache-00
          path: runtime-export/chunks/hf-cache.part-00
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload HF cache part 01
        uses: actions/upload-artifact@v7
        with:
          name: careerops-jina-cache-01
          path: runtime-export/chunks/hf-cache.part-01
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload HF cache part 02
        uses: actions/upload-artifact@v7
        with:
          name: careerops-jina-cache-02
          path: runtime-export/chunks/hf-cache.part-02
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

      - name: Upload HF cache part 03
        uses: actions/upload-artifact@v7
        with:
          name: careerops-jina-cache-03
          path: runtime-export/chunks/hf-cache.part-03
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
