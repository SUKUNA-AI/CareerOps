name: E2E Baseline

on:
  pull_request:
    branches:
      - main
      - architecture-reset
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-jina-baseline:
    name: E2E baseline / live Jina + native matching core
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_ETAG_TIMEOUT: "60"
      HF_HUB_DOWNLOAD_TIMEOUT: "300"
      CAREEROPS_RERANKER_RUNTIME_BACKEND: transformers-cpu
      CAREEROPS_RERANKER_DTYPE: float32
      CAREEROPS_RERANKER_DEVICE: cpu
      CAREEROPS_RERANKER_HOST: 127.0.0.1
      CAREEROPS_RERANKER_PORT: "18082"
      CAREEROPS_TEST_RERANKER_URL: http://127.0.0.1:18082
      CAREEROPS_TEST_MATCHING_CORE_TARGET: 127.0.0.1:18083
      CAREEROPS_E2E_BASELINE: "1"
      CAREEROPS_CI_BASELINE_REPORT: reports/e2e-baseline.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install matching core build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            libboost-dev \
            libgrpc++-dev \
            libprotobuf-dev \
            pkg-config \
            protobuf-compiler \
            protobuf-compiler-grpc

      - name: Build matching core
        run: |
          cmake \
            -S services/careerops-matching-core \
            -B build/matching-core \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/matching-core --parallel

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache pinned Jina model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: >-
            jina-reranker-v3.5-e8a93f33-python312-${{ runner.os }}

      - name: Install CareerOPS and CPU reranker runtime
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.14.0"
          python -m pip install "transformers==4.57.3"
          python -m pip check

      - name: Start native matching core
        run: |
          set -euo pipefail
          mkdir -p reports
          nohup env \
            CAREEROPS_MATCHING_CORE_LISTEN_ADDR="${CAREEROPS_TEST_MATCHING_CORE_TARGET}" \
            build/matching-core/careerops-matching-core \
            > reports/matching-core.log 2>&1 &
          echo $! > reports/matching-core.pid

      - name: Wait for matching core readiness
        run: |
          python - <<'PY'
          import grpc
          import os

          target = os.environ["CAREEROPS_TEST_MATCHING_CORE_TARGET"]
          channel = grpc.insecure_channel(target)
          try:
              grpc.channel_ready_future(channel).result(timeout=15)
          finally:
              channel.close()
          PY

      - name: Start pinned Jina reranker
        run: |
          set -euo pipefail
          mkdir -p reports
          nohup python -m careerops_reranker > reports/reranker.log 2>&1 &
          echo $! > reports/reranker.pid

      - name: Wait for reranker readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18082/readyz \
              -o reports/reranker-ready.json; then
              cat reports/reranker-ready.json
              exit 0
            fi

            if ! kill -0 "$(cat reports/reranker.pid)" 2>/dev/null; then
              echo "reranker process exited before readiness" >&2
              cat reports/reranker.log >&2 || true
              exit 1
            fi

            sleep 5
          done

          echo "reranker did not become ready within 15 minutes" >&2
          cat reports/reranker.log >&2 || true
          exit 1

      - name: Capture metrics before baseline
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:18082/metrics \
            -o reports/reranker-metrics-before.txt

      - name: Run compact P2-03 through P2-07 baseline
        run: |
          python -m pytest \
            -q \
            --tb=short \
            -p no:cacheprovider \
            -m integration_e2e_baseline \
            tests/integration/e2e \
            --junitxml=reports/e2e-baseline.xml

      - name: Capture metrics after baseline
        if: ${{ !cancelled() }}
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:18082/metrics \
            -o reports/reranker-metrics-after.txt || true

      - name: Stop native services
        if: ${{ always() }}
        run: |
          if test -f reports/reranker.pid; then
            kill "$(cat reports/reranker.pid)" 2>/dev/null || true
          fi
          if test -f reports/matching-core.pid; then
            kill "$(cat reports/matching-core.pid)" 2>/dev/null || true
          fi

      - name: Upload E2E baseline artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: careerops-e2e-baseline
          path: reports/
          if-no-files-found: error
          retention-days: 14
